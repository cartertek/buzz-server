name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment from the latest published release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  resolve:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0
      - name: Resolve and await current master CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          master_sha=$(git rev-parse HEAD)
          remote_master=$(gh api "repos/${GH_REPO}/git/ref/heads/master" --jq .object.sha)
          test "$master_sha" = "$remote_master" || {
            echo "checked-out master moved during release initialization" >&2
            exit 1
          }

          run_id=
          attempts=0
          while [ -z "$run_id" ] && [ "$attempts" -lt 60 ]; do
            run_id=$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?branch=master&event=push&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${master_sha}\") | .id" | head -1)
            [ -n "$run_id" ] || {
              attempts=$((attempts + 1))
              echo "Waiting for master CI run for ${master_sha} to appear (${attempts}/60)..."
              sleep 10
            }
          done
          test -n "$run_id" || {
            echo "current master ${master_sha} did not start a push CI run within 10 minutes" >&2
            exit 1
          }

          echo "Waiting for master CI run ${run_id} for ${master_sha} to complete..."
          gh run watch "$run_id" --exit-status
          printf 'sha=%s\n' "$master_sha" >> "$GITHUB_OUTPUT"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

  promote:
    needs: resolve
    uses: ./.github/workflows/release-core.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      source_run_id: ${{ needs.resolve.outputs.run_id }}
      expected_event: push
      bump: ${{ inputs.bump }}
      publish: true
