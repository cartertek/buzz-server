name: Buzz upstream freshness

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check pinned Buzz revision against latest Desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-buzz-upstream.sh
