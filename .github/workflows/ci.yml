name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: rustup override set 1.88.0
      - run: cargo fmt --check
      - name: Test configuration migrations
        run: python3 -m unittest tests/test_migrate_legacy_owner.py
      - name: Validate deployment scripts and units
        run: |
          set -eu
          for script in deploy/*.sh deploy/buzz-server deploy/buzz-serverctl scripts/package-artifact.sh scripts/prepare-ci-payload.sh scripts/verify-package-artifact.sh scripts/github-tag-sha.sh scripts/resolve-release.sh scripts/publish-release.sh scripts/mock-gh-release.sh; do sh -n "$script"; done
          tests/test_agent_reload.sh
          sudo install -d /opt/buzz-server/current/share/deploy
          sudo install -m 0755 /bin/true /opt/buzz-server/current/buzz-server
          sudo install -m 0755 /bin/true /opt/buzz-server/current/share/deploy/healthcheck.sh
          sudo install -m 0755 /bin/true /opt/buzz-server/current/share/deploy/prepare-community-identities.sh
          systemd-analyze verify deploy/buzz-server.service deploy/buzz-server-healthcheck.service deploy/buzz-server-healthcheck.timer
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: scripts/check-provider-upstream.sh

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: public.ecr.aws/amazonlinux/amazonlinux@sha256:601289f29d1b67fc542a451beda8ac6ca542d40289c99f71faa3ba37fe0d133a
    steps:
      - name: Install glibc 2.34 build prerequisites
        run: dnf install -y gcc gcc-c++ git tar gzip findutils binutils diffutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.88.0 --target "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked --target '${{ matrix.target }}' --bins
      - name: Build pinned upstream Buzz CLI
        env:
          TARGET: ${{ matrix.target }}
          BUZZ_REV: 391495e7d347d20b67e39e3c240d17ef63c5c2c0
        run: |
          set -eu
          git clone --filter=blob:none https://github.com/block/buzz.git upstream-buzz
          git -C upstream-buzz fetch --depth 1 origin "$BUZZ_REV"
          git -C upstream-buzz checkout --detach FETCH_HEAD
          (cd upstream-buzz && cargo build --release --locked --target "$TARGET" -p buzz-cli)
      - name: Enforce deployment-host glibc compatibility
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          for binary in "target/${TARGET}/release/buzz-server" "upstream-buzz/target/${TARGET}/release/buzz"; do
            if readelf --version-info "$binary" | grep -Eq 'Name: GLIBC_2\.(3[5-9]|[4-9][0-9])'; then
              echo "$binary requires a glibc version newer than the supported 2.34 baseline" >&2
              readelf --version-info "$binary" | grep 'Name: GLIBC_' >&2
              exit 1
            fi
          done
      - name: Prepare canonical build payload
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/prepare-ci-payload.sh "$TARGET" upstream-buzz "payload/$TARGET"
      - name: Package downloadable CI artifact
        env:
          TARGET: ${{ matrix.target }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -eu
          scripts/package-artifact.sh "payload/$TARGET" "${BUILD_SHA}" "$TARGET" dist
      - name: Verify finished CI artifact
        env:
          TARGET: ${{ matrix.target }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -eu
          scripts/verify-package-artifact.sh \
            "dist/buzz-server-${TARGET}.tar.gz" \
            "dist/buzz-server-${TARGET}.tar.gz.sha256" \
            "$BUILD_SHA" "$TARGET" "payload/$TARGET"
      - name: Record build identity
        env:
          TARGET: ${{ matrix.target }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          metadata="dist/build-metadata-${TARGET}.txt"
          {
            printf 'event=%s\n' "$EVENT_NAME"
            printf 'target=%s\n' "$TARGET"
            printf 'tested_ref=%s\n' "$BUILD_REF"
            printf 'tested_sha=%s\n' "$BUILD_SHA"
            if [ "$EVENT_NAME" = pull_request ]; then
              printf 'pr_number=%s\n' "$PR_NUMBER"
              printf 'pr_head_sha=%s\n' "$PR_HEAD_SHA"
              printf 'pr_base_sha=%s\n' "$PR_BASE_SHA"
            fi
          } > "$metadata"
          cp "$metadata" "payload/$TARGET/build-metadata.txt"

          {
            printf '### Build identity — `%s`\n\n' "$TARGET"
            printf '| Field | Value |\n|---|---|\n'
            printf '| Event | `%s` |\n' "$EVENT_NAME"
            printf '| Tested ref | `%s` |\n' "$BUILD_REF"
            printf '| Tested SHA | `%s` |\n' "$BUILD_SHA"
            if [ "$EVENT_NAME" = pull_request ]; then
              printf '| PR | #%s |\n' "$PR_NUMBER"
              printf '| PR head SHA | `%s` |\n' "$PR_HEAD_SHA"
              printf '| PR base SHA | `%s` |\n' "$PR_BASE_SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buzz-server-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/build-metadata-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-payload-${{ matrix.target }}
          path: payload/${{ matrix.target }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  release-dry-run:
    if: github.event_name == 'pull_request'
    needs: build
    uses: ./.github/workflows/release-core.yml
    permissions:
      contents: read
      actions: read
    with:
      source_sha: ${{ github.sha }}
      source_run_id: ${{ github.run_id }}
      expected_event: pull_request
      bump: patch
      publish: false
