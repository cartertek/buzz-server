name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: rustup override set 1.88.0
      - run: cargo fmt --check
      - name: Validate deployment scripts and units
        run: |
          set -eu
          for script in deploy/*.sh deploy/buzz-server deploy/buzz-serverctl; do sh -n "$script"; done
          sudo install -d /opt/buzz-server/current/share/deploy
          sudo install -m 0755 /bin/true /opt/buzz-server/current/buzz-server
          sudo install -m 0755 /bin/true /opt/buzz-server/current/share/deploy/prepare-owner-credential.sh
          sudo install -m 0755 /bin/true /opt/buzz-server/current/share/deploy/healthcheck.sh
          systemd-analyze verify deploy/buzz-server.service deploy/buzz-server-healthcheck.service deploy/buzz-server-healthcheck.timer
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: scripts/check-provider-upstream.sh

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: public.ecr.aws/amazonlinux/amazonlinux@sha256:601289f29d1b67fc542a451beda8ac6ca542d40289c99f71faa3ba37fe0d133a
    steps:
      - name: Install glibc 2.34 build prerequisites
        run: dnf install -y gcc gcc-c++ git tar gzip findutils binutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.88.0 --target "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked --target '${{ matrix.target }}' --bins
      - name: Enforce deployment-host glibc compatibility
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          binary="target/${TARGET}/release/buzz-server"
          if readelf --version-info "$binary" | grep -Eq 'Name: GLIBC_2\.(3[5-9]|[4-9][0-9])'; then
            echo "release requires a glibc version newer than the supported 2.34 baseline" >&2
            readelf --version-info "$binary" | grep 'Name: GLIBC_' >&2
            exit 1
          fi
