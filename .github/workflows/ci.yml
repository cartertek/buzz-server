name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: rustup override set 1.88.0
      - run: cargo fmt --check
      - name: Validate deployment scripts and units
        run: |
          set -eu
          for script in deploy/*.sh deploy/buzz-server deploy/buzz-serverctl; do sh -n "$script"; done
          sudo install -d /opt/buzz-server/current/share/deploy
          sudo install -m 0755 /bin/true /opt/buzz-server/current/buzz-server
          sudo install -m 0755 /bin/true /opt/buzz-server/current/share/deploy/prepare-owner-credential.sh
          sudo install -m 0755 /bin/true /opt/buzz-server/current/share/deploy/healthcheck.sh
          systemd-analyze verify deploy/buzz-server.service deploy/buzz-server-healthcheck.service deploy/buzz-server-healthcheck.timer
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: scripts/check-provider-upstream.sh

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: public.ecr.aws/amazonlinux/amazonlinux@sha256:601289f29d1b67fc542a451beda8ac6ca542d40289c99f71faa3ba37fe0d133a
    steps:
      - name: Install glibc 2.34 build prerequisites
        run: dnf install -y gcc gcc-c++ git tar gzip findutils binutils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.88.0 --target "$TARGET"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked --target '${{ matrix.target }}' --bins
      - name: Build pinned upstream Buzz CLI
        env:
          TARGET: ${{ matrix.target }}
          BUZZ_REV: 79c52166cfe6b6d36bdc7686f943595c74e2f578
        run: |
          set -eu
          git clone --filter=blob:none https://github.com/block/buzz.git upstream-buzz
          git -C upstream-buzz fetch --depth 1 origin "$BUZZ_REV"
          git -C upstream-buzz checkout --detach FETCH_HEAD
          (cd upstream-buzz && cargo build --release --locked --target "$TARGET" -p buzz-cli)
      - name: Enforce deployment-host glibc compatibility
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          for binary in "target/${TARGET}/release/buzz-server" "upstream-buzz/target/${TARGET}/release/buzz"; do
            if readelf --version-info "$binary" | grep -Eq 'Name: GLIBC_2\.(3[5-9]|[4-9][0-9])'; then
              echo "$binary requires a glibc version newer than the supported 2.34 baseline" >&2
              readelf --version-info "$binary" | grep 'Name: GLIBC_' >&2
              exit 1
            fi
          done
      - name: Package PR artifact
        env:
          TARGET: ${{ matrix.target }}
          VERSION: v0.0.0-pr-${{ github.sha }}
        run: |
          set -eu
          package="buzz-server"
          mkdir -p "dist/${package}/config" "dist/${package}/deploy"
          install -m 0755 "target/${TARGET}/release/buzz-server" "dist/${package}/buzz-server-daemon"
          sed "s/@BUZZ_SERVER_VERSION@/${VERSION}/g" deploy/buzz-server > "dist/${package}/buzz-server"
          chmod 0755 "dist/${package}/buzz-server"
          install -m 0755 "target/${TARGET}/release/buzz-agentctl" "dist/${package}/buzz-agentctl"
          install -m 0755 "target/${TARGET}/release/buzz-secretsctl" "dist/${package}/buzz-secretsctl"
          install -m 0755 "target/${TARGET}/release/buzz-runtime-probe" "dist/${package}/buzz-runtime-probe"
          install -m 0755 "upstream-buzz/target/${TARGET}/release/buzz" "dist/${package}/buzz-cli"
          install -m 0644 config/buzz-server.dev.example.json config/buzz-server.schema.json "dist/${package}/config/"
          install -m 0644 deploy/buzz-server.service deploy/buzz-server-healthcheck.service deploy/buzz-server-healthcheck.timer deploy/README.md "dist/${package}/deploy/"
          sed -e "s/@BUZZ_SERVER_VERSION@/${VERSION}/g" -e "s/@BUZZ_SERVER_TARGET@/${TARGET}/g" deploy/install.sh > "dist/${package}/deploy/install.sh"
          chmod 0755 "dist/${package}/deploy/install.sh"
          install -m 0755 deploy/install-release.sh deploy/buzz-serverctl deploy/provision-runtimes.sh deploy/prepare-owner-credential.sh deploy/backup.sh deploy/restore.sh deploy/rotate-owner.sh deploy/healthcheck.sh deploy/disaster-recovery-exercise.sh "dist/${package}/deploy/"
          asset="buzz-server-${TARGET}.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C dist -cf - "${package}" | gzip -n > "dist/${asset}"
          (cd dist && sha256sum "${asset}" > "${asset}.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buzz-server-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
