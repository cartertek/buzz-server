name: Release Core

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      expected_event:
        required: true
        type: string
      bump:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUMP: ${{ inputs.bump }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          latest=$(gh api "repos/${GH_REPO}/releases?per_page=100" --paginate --jq \
            '[.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^v"; "") | split(".") | map(tonumber)] | sort | last | @tsv')
          if [ -z "$latest" ] || [ "$latest" = null ]; then
            major=0; minor=0; patch=0
          else
            set -- $latest
            major=$1; minor=$2; patch=$3
          fi
          case "$BUMP" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "unsupported version bump: $BUMP" >&2; exit 64 ;;
          esac
          tag="v${major}.${minor}.${patch}"

          # Always exercise tag resolution, including in PR dry-runs.
          tag_sha=$(scripts/github-tag-sha.sh "$GH_REPO" "$tag")
          if [ "$PUBLISH" = true ]; then
            remote_master=$(gh api "repos/${GH_REPO}/git/ref/heads/master" --jq .object.sha)
            test "$SOURCE_SHA" = "$remote_master" || {
              echo "release source ${SOURCE_SHA} is no longer current master ${remote_master}" >&2
              exit 1
            }
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$SOURCE_SHA" ]; then
              echo "tag ${tag} already exists at ${tag_sha}; refusing to move an immutable release identity" >&2
              exit 1
            fi
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          {
            printf '### Release promotion\n\n'
            printf '| Field | Value |\n|---|---|\n'
            printf '| Mode | `%s` |\n' "$(if [ "$PUBLISH" = true ]; then printf publish; else printf dry-run; fi)"
            printf '| Source SHA | `%s` |\n' "$SOURCE_SHA"
            printf '| Source CI run | `%s` |\n' '${{ inputs.source_run_id }}'
            printf '| Expected source event | `%s` |\n' '${{ inputs.expected_event }}'
            printf '| Calculated tag | `%s` |\n' "$tag"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download canonical CI payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: release-payload-*
          path: payloads
      - name: Verify payload identities and package release
        env:
          SHA: ${{ inputs.source_sha }}
          TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_EVENT: ${{ inputs.expected_event }}
        run: |
          set -eu
          mkdir dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            payload="payloads/release-payload-${target}"
            test -d "$payload"
            grep -Fx "tested_sha=${SHA}" "$payload/build-metadata.txt"
            grep -Fx "event=${EXPECTED_EVENT}" "$payload/build-metadata.txt"
            grep -Fx "target=${target}" "$payload/build-metadata.txt"
            scripts/package-artifact.sh "$payload" "$TAG" "$target" dist
          done
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            scripts/verify-package-artifact.sh \
              "dist/buzz-server-${target}.tar.gz" \
              "dist/buzz-server-${target}.tar.gz.sha256" \
              "$TAG" "$target" "payloads/release-payload-${target}"
          done
      - name: Upload dry-run release artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*.tar.gz
      - name: Execute release publication logic
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ inputs.source_sha }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          if [ "$PUBLISH" = true ]; then
            scripts/publish-release.sh "$TAG" "$SHA" dist
          else
            mock_bin=$(mktemp -d)
            ln -s "$PWD/scripts/mock-gh-release.sh" "$mock_bin/gh"

            # Fresh release: absent tag, create draft, upload every asset, verify, publish.
            fresh=$(mktemp -d)
            PATH="$mock_bin:$PATH" RELEASE_TEST_STATE="$fresh" \
              scripts/publish-release.sh "$TAG" "$SHA" dist
            test "$(cat "$fresh/tag-sha")" = "$SHA"
            test "$(cat "$fresh/release-state")" = published
            test "$(find "$fresh/assets" -maxdepth 1 -type f | wc -l)" -eq 4

            # Retry release: existing tag + draft + one already-uploaded asset.
            retry=$(mktemp -d)
            mkdir -p "$retry/assets"
            printf '%s\n' "$SHA" > "$retry/tag-sha"
            printf 'draft\n' > "$retry/release-state"
            first=$(find dist -maxdepth 1 -type f | sort | head -1)
            cp "$first" "$retry/assets/$(basename "$first")"
            PATH="$mock_bin:$PATH" RELEASE_TEST_STATE="$retry" \
              scripts/publish-release.sh "$TAG" "$SHA" dist
            test "$(cat "$retry/release-state")" = published
            test "$(find "$retry/assets" -maxdepth 1 -type f | wc -l)" -eq 4
          fi
