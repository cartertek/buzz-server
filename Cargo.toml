[package]
name = "buzz-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Headless Buzz client for operating always-on agents"
publish = false

[dependencies]
buzz-sdk = { git = "https://github.com/block/buzz.git", rev = "a5dbdf5e61e4c512acd99c219c79c154ddb57295", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.17"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
nostr = { version = "0.44", features = ["nip44", "nip98"] }
serde_json = "1.0.151"
