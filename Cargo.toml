[package]
name = "buzz-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Headless Buzz client for operating always-on agents"
publish = false

[dependencies]
buzz-sdk = { git = "https://github.com/block/buzz.git", rev = "7ff5fc31895efe6265a379d01637c8ee301872e5", version = "0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
nostr = { version = "0.44", features = ["nip44", "nip98"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

